name: Deploy PR preview to staging

# Step 2 of 2 for the pull request staging preview (#91).
#
# Trigger: `workflow_run` after "Build PR preview" ends. This workflow file
# always comes from the default branch. It holds the AWS role. It never checks
# out or runs pull request code. It downloads the build artifact, validates
# it as untrusted input, and syncs only that artifact to the
# staging bucket root, the same as the old single-job preview did. It never
# writes to the production bucket. The PR number is used for logs and the
# summary only.
#
# Do not add a `ref` to the checkout below. Do not run any file from the
# artifact. Do not add `environment:` to the job: a job that declares an
# environment cannot assume the shared deploy role, which trusts the `main`
# branch subject only.
#
# A workflow_run workflow only runs from the default branch, so this file has
# no effect until it is merged.

on:
  workflow_run:
    workflows: ["Build PR preview"]
    types: [completed]

permissions:
  id-token: write # assume the AWS role via OIDC
  contents: read
  actions: read # download the artifact of the build run
  pull-requests: read # find the PR number for a fork head

env:
  BUCKET: apexyard-site-staging
  SITE_DOMAIN: staging.apexyard.ai
  ROLE_ARN: arn:aws:iam::340541183783:role/github-actions-deployer

jobs:
  deploy:
    name: publish PR preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: preview-deploy-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      # Trusted code only: the default branch, for the helper scripts.
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the pull request number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PAYLOAD_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          pr="$PAYLOAD_PR"
          if [ -z "$pr" ]; then
            # Fork pull requests leave the payload list empty. Ask the API
            # which open PR in this repository has this exact head commit.
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head sha"; exit 1; }
            pr=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              --jq "[.[] | select(.state == \"open\" and .base.repo.full_name == \"${REPO}\" and .head.sha == \"${HEAD_SHA}\")][0].number // empty")
          fi
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::could not resolve a numeric pull request number"
            exit 1
          fi
          echo "number=${pr}" >> "$GITHUB_OUTPUT"

      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-site
          path: artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate artifact (untrusted input)
        run: .github/scripts/validate-preview-artifact.sh artifact

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync PR preview to staging S3
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::bad PR number"; exit 1; }
          echo "publish preview of PR #${PR_NUMBER} to s3://${BUCKET}"
          aws s3 sync artifact "s3://${BUCKET}" \
            --delete \
            --no-follow-symlinks \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "og/node_modules/*" \
            --exclude "og/templates/*" \
            --exclude "og/render*" \
            --exclude "og/package*.json" \
            --exclude "og/.gitignore" \
            --exclude "og/README.md" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --exclude ".lycheeignore"

      - name: Publish markdown alternates to staging
        run: |
          shopt -s nullglob
          for f in artifact/*.md.gen; do
            [ -f "$f" ] && [ ! -L "$f" ] || continue
            key="$(basename "${f%.gen}")"
            echo "publish ${f} -> s3://${BUCKET}/${key}"
            aws s3 cp "$f" "s3://${BUCKET}/${key}" \
              --content-type "text/markdown; charset=utf-8"
          done

      - name: Publish staging robots.txt
        run: |
          printf '%s\n' \
            '# Staging environment - not for indexing or crawling.' \
            '# The CloudFront layer also sets X-Robots-Tag: noindex, nofollow.' \
            'User-agent: *' \
            'Disallow: /' > /tmp/staging-robots.txt
          aws s3 cp /tmp/staging-robots.txt "s3://${BUCKET}/robots.txt" \
            --content-type "text/plain; charset=utf-8"

      - name: Invalidate staging CloudFront
        env:
          STACK_HINT: the apexyard-site-staging stack
        run: .github/scripts/invalidate-cloudfront.sh

      - name: Summary
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          echo "Preview of PR #${PR_NUMBER}: https://${SITE_DOMAIN}/" >> "$GITHUB_STEP_SUMMARY"
