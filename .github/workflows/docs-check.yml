name: Docs build and checks

# Builds the /docs sub-build from me2resh/apexyard at the pinned tag, then
# runs the page-count, link, exclusion, page-part and contrast checks.
# No secrets and no AWS access.

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/scripts/build-docs.sh'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [staging]
    paths:
      - 'docs-site/**'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Write the private term list (optional)
        env:
          TERMS: ${{ secrets.DOCS_PRIVATE_TERMS }}
        run: |
          if [ -n "$TERMS" ]; then
            printf '%s\n' "$TERMS" > "$RUNNER_TEMP/private-terms.txt"
            echo "DOCS_PRIVATE_TERMS=$RUNNER_TEMP/private-terms.txt" >> "$GITHUB_ENV"
          else
            echo "No DOCS_PRIVATE_TERMS secret. The check uses the generic terms only."
          fi
      - name: Build and check the docs
        run: .github/scripts/build-docs.sh "$RUNNER_TEMP/site"
