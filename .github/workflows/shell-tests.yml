name: Shell Tests

# Runs the repo's shell regression guards. These cover logic that only ever
# executes inside a deploy — the CloudFront invalidation guard from #48 is the
# first — so without this job the behaviour is untested until it runs against
# production. lychee's path filter (*.html / *.md) means a change to the deploy
# workflows otherwise lands with no CI at all.
#
# Fast and dependency-free: the tests stub `aws` and `curl` on PATH and build
# synthetic git repos in a tempdir, so nothing here touches AWS, the real
# framework clone, or the network.
#
# README.md and og/render.sh are in the path filter because #72 bound both to
# .github/scripts/derive-counts.sh: the README's definition block is asserted
# byte-identical to `--recipes`, and render.sh sources the library. Editing
# either outside .github/ can now break a test, so both have to trigger the run.
#
# The public page files are in the filter because #102 added
# test-overlay-isolation.sh: it fails when a page holds a bare placeholder
# token or price-shaped text, so a content change must trigger the run.
#
# The docs lint files are in the filter because #107 added test-docs-lint.sh,
# which runs docs-site/scripts/lint-docs.mjs on fixtures.
#
# creator-brief.md and skill.md are in the filter because #102 added
# test-works-with.sh, which reads both files.

# The two path lists are duplicated rather than shared via a YAML anchor:
# GitHub Actions' workflow parser does not support anchors/aliases, so `&`/`*`
# here would fail to parse rather than de-duplicate. Keep them in step.
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/deploy-aws*.yml"
      - ".github/workflows/deploy-staging-v2.yml"
      - ".github/workflows/preview-*.yml"
      - ".github/workflows/shell-tests.yml"
      - ".github/workflows/private-terms.yml"
      - ".github/workflows/private-terms-pr-text.yml"
      - ".githooks/**"
      - "og/render.sh"
      - "README.md"
      - "*.html"
      - "*.md.gen"
      - "*.txt"
      - "*.xml"
      - "skill.md"
      - "creator-brief.md"
      - "claims.js"
      - "waitlist.js"
      - "site-config.js"
      - "product.css"
      - "apexdock/**"
      - "docs-site/scripts/lint-docs.mjs"
      - "docs-site/lint/**"
      - "docs-site/package.json"
      - "install"
      - "install.source"
  push:
    branches: [main, staging]
    paths:
      - ".github/scripts/**"
      - ".github/tests/**"
      - ".github/workflows/deploy-aws*.yml"
      - ".github/workflows/deploy-staging-v2.yml"
      - ".github/workflows/preview-*.yml"
      - ".github/workflows/shell-tests.yml"
      - ".github/workflows/private-terms.yml"
      - ".github/workflows/private-terms-pr-text.yml"
      - ".githooks/**"
      - "og/render.sh"
      - "README.md"
      - "*.html"
      - "*.md.gen"
      - "*.txt"
      - "*.xml"
      - "skill.md"
      - "creator-brief.md"
      - "claims.js"
      - "waitlist.js"
      - "site-config.js"
      - "product.css"
      - "apexdock/**"
      - "docs-site/scripts/lint-docs.mjs"
      - "docs-site/lint/**"
      - "docs-site/package.json"
      - "install"
      - "install.source"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    name: deploy script guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # -x + --source-path=SCRIPTDIR so shellcheck follows the `.` into
      # derive-counts.sh from both callers and resolves it relative to each
      # script's own directory — og/render.sh reaches it via a different
      # relative path than verify-counts.sh does.
      - name: Lint shell scripts
        run: |
          shellcheck -x --source-path=SCRIPTDIR \
            .github/scripts/*.sh .github/tests/*.sh .githooks/*-private-terms .githooks/private-terms-lib.sh og/render.sh

      - name: Run test suites
        run: |
          shopt -s nullglob
          for t in .github/tests/test-*.sh; do
            echo "::group::$t"
            "$t"
            echo "::endgroup::"
          done
