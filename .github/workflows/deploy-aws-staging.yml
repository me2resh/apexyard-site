name: Deploy to AWS Staging (S3 + CloudFront)

# Syncs the static site to S3 (apexyard-site-staging) and invalidates
# CloudFront, the staging mirror of deploy-aws.yml. Auth is via OIDC into the
# shared deploy role, which trusts the `main` branch only (#91). No long-lived
# AWS keys. This workflow runs by manual dispatch, and only from `main`. The
# job guard below fails fast for any other ref. Pull request previews use
# preview-build.yml and preview-deploy.yml.
#
# Prereq: the apexyard-site-staging infrastructure stack must be APPLIED
# first (the bucket and distribution have to exist). Until then the invalidation
# step warns and no-ops instead of failing, same as deploy-aws.yml, but ONLY
# when it can show the distribution genuinely isn't there (see #48). Shared
# logic lives in .github/scripts/invalidate-cloudfront.sh.

on:
  workflow_dispatch:

permissions:
  id-token: write # assume the AWS role via OIDC
  contents: read

concurrency:
  group: deploy-aws-staging
  cancel-in-progress: true

env:
  BUCKET: apexyard-site-staging
  SITE_DOMAIN: staging.apexyard.ai
  ROLE_ARN: arn:aws:iam::340541183783:role/github-actions-deployer

jobs:
  deploy:
    name: s3 sync + invalidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync static site to S3
        run: |
          aws s3 sync . "s3://${BUCKET}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "og/node_modules/*" \
            --exclude "og/templates/*" \
            --exclude "og/render*" \
            --exclude "og/package*.json" \
            --exclude "og/.gitignore" \
            --exclude "og/README.md" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --exclude ".lycheeignore"

      - name: Publish markdown alternates at clean .md keys
        run: |
          # Netlify served the .md.gen files at /skills.md etc. via _redirects.
          # On CloudFront we publish each .md.gen at its bare .md key so the
          # LLM-consumer alternates keep resolving.
          shopt -s nullglob
          for f in *.md.gen; do
            key="${f%.gen}"
            echo "publish $f -> s3://${BUCKET}/${key}"
            aws s3 cp "$f" "s3://${BUCKET}/${key}" \
              --content-type "text/markdown; charset=utf-8"
          done

      - name: Publish a staging-specific robots.txt (Disallow)
        run: |
          # The s3 sync above lands PRODUCTION's robots.txt (Allow: /), which
          # reads as "crawl everything" — the wrong signal for a pre-prod env.
          # Overwrite the key with a staging robots that disallows crawling.
          # This is belt-and-suspenders with the `X-Robots-Tag: noindex,
          # nofollow` response header the CloudFront layer already sets on every
          # response (apexyard-site-staging CloudFront stack) — the
          # header is what actually keeps staging out of the index; this stops a
          # compliant crawler from fetching in the first place. Staging only —
          # deploy-aws.yml (prod) keeps prod's Allow: / untouched. See #50.
          # printf (not a heredoc) so YAML space-indentation can't leak leading
          # whitespace into the robots directives.
          printf '%s\n' \
            '# Staging environment — not for indexing or crawling.' \
            '# See also the X-Robots-Tag: noindex, nofollow response header set' \
            '# at the CloudFront layer (apexyard-site-staging stack).' \
            'User-agent: *' \
            'Disallow: /' > /tmp/staging-robots.txt
          echo "publish staging robots.txt -> s3://${BUCKET}/robots.txt"
          aws s3 cp /tmp/staging-robots.txt "s3://${BUCKET}/robots.txt" \
            --content-type "text/plain; charset=utf-8"

      - name: Invalidate CloudFront
        env:
          STACK_HINT: the apexyard-site-staging stack
        run: .github/scripts/invalidate-cloudfront.sh
