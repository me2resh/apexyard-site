name: Deploy site v2 to staging (private overlay)

# #102. Deploys the `staging` branch to staging.apexyard.ai and fills the
# placeholder tokens from the private STAGING_OVERLAY secret. This is the
# only workflow that reads that secret or runs apply-overlay.sh.
#
# Isolation:
#   - The job declares `environment: staging`. The `staging` environment
#     admits only the `staging` branch (deployment branch policy), so no other
#     ref can read the secret.
#   - Production jobs (deploy-aws.yml) never declare this environment and
#     never call apply-overlay.sh. .github/tests/test-overlay-isolation.sh
#     checks this on every pull request.
#   - The overlay output lives in $RUNNER_TEMP only. It is never committed,
#     never uploaded as an artifact, and never written to the step summary.
#   - The last step fetches production and fails if any overlay value is
#     there.
#
# AWS access: a job that declares `environment:` presents the OIDC subject
# `repo:me2resh/apexyard-site:environment:staging`. The shared
# github-actions-deployer role trusts `ref:refs/heads/main` only, so this job
# needs its own role, scoped to the staging bucket and distribution. Set its
# ARN in the STAGING_OVERLAY_ROLE_ARN repo variable. Until then the job stops
# before any AWS call.
#
# Log rules: no `set -x`, no echo of a value. apply-overlay.sh masks every
# value before it does anything else.

on:
  push:
    branches: [staging]

permissions:
  id-token: write # assume the scoped staging role via OIDC
  contents: read

concurrency:
  group: apexyard-staging-v2
  cancel-in-progress: true

env:
  BUCKET: apexyard-site-staging
  SITE_DOMAIN: staging.apexyard.ai

jobs:
  # #107. Build the /docs sub-build in its own job. This job runs npm, so it
  # gets no AWS access and reads no secret. It passes only the built docs
  # files to the deploy job, as the `docs-site` artifact. The artifact holds
  # no overlay value: the overlay runs later, in the deploy job only.
  # docs-check.yml runs the private term check on each pull request.
  docs:
    name: build /docs
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Build and check the docs
        run: .github/scripts/build-docs.sh "$RUNNER_TEMP/docs-out"
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-out
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: overlay + s3 sync + invalidate
    needs: docs
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.apexyard.ai/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the scoped staging role is configured
        env:
          ROLE_ARN: ${{ vars.STAGING_OVERLAY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Set the STAGING_OVERLAY_ROLE_ARN repo variable to the scoped staging deploy role. See the header of this workflow."
            exit 1
          fi

      - name: Check tracked files for overlay values
        env:
          OVERLAY_JSON: ${{ secrets.STAGING_OVERLAY }}
          REQUIRE_PRIVATE_TERMS: "true"
        run: .github/scripts/check-private-terms.sh .

      - name: Apply the private overlay
        env:
          OVERLAY_JSON: ${{ secrets.STAGING_OVERLAY }}
        run: .github/scripts/apply-overlay.sh . "$RUNNER_TEMP/site"

      - name: Write GitHub stars and forks for the home page
        # #137. Public data, no token. If the read fails, the script writes
        # no file and the home page hides the numbers (AgDR-0011).
        run: .github/scripts/write-github-stats.sh "$RUNNER_TEMP/site/github-stats.json"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_OVERLAY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync the overlaid site to staging S3
        run: |
          aws s3 sync "$RUNNER_TEMP/site" "s3://${BUCKET}" \
            --delete \
            --only-show-errors \
            --no-follow-symlinks \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "og/node_modules/*" \
            --exclude "og/templates/*" \
            --exclude "og/render*" \
            --exclude "og/package*.json" \
            --exclude "og/.gitignore" \
            --exclude "og/README.md" \
            --exclude "docs/*" \
            --exclude "docs.html" \
            --exclude "docs-site/*" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --exclude ".lycheeignore" \
            --exclude "install" \
            --exclude "install.html" \
            --exclude "install.source"

      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ${{ runner.temp }}/docs-out

      - name: Publish the docs sub-build to staging
        # build-docs.sh writes docs.html (the /docs home) and docs/ (every
        # other docs file). The site sync above excludes both paths, so its
        # --delete does not remove them. The first rm removes the docs-site
        # source files that an earlier sync uploaded.
        run: |
          out="$RUNNER_TEMP/docs-out"
          test -f "$out/docs.html"
          test -f "$out/docs/pagefind/pagefind.js"
          aws s3 rm "s3://${BUCKET}/docs-site/" --recursive --only-show-errors
          aws s3 sync "$out/docs" "s3://${BUCKET}/docs" \
            --delete \
            --only-show-errors \
            --no-follow-symlinks
          aws s3 cp "$out/docs.html" "s3://${BUCKET}/docs.html" \
            --only-show-errors \
            --content-type "text/html; charset=utf-8"
          echo "published $(find "$out/docs" -name '*.html' | wc -l | tr -d ' ') docs pages and docs.html"

      - name: Publish markdown alternates to staging
        run: |
          shopt -s nullglob
          for f in "$RUNNER_TEMP"/site/*.md.gen; do
            key="$(basename "${f%.gen}")"
            echo "publish ${key}"
            aws s3 cp "$f" "s3://${BUCKET}/${key}" \
              --only-show-errors \
              --content-type "text/markdown; charset=utf-8"
          done

      - name: Publish the install script to staging
        # #100. The edge function rewrites /install to /install.html, so the
        # key is install.html (AgDR-0009). The site sync above excludes
        # install, install.html and install.source. This step sets the
        # content type and a short cache. The production workflow does not
        # publish /install yet.
        run: |
          aws s3 cp "$RUNNER_TEMP/site/install" "s3://${BUCKET}/install.html" \
            --only-show-errors \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "max-age=300"

      - name: Publish staging robots.txt
        run: |
          printf '%s\n' \
            '# Staging environment - not for indexing or crawling.' \
            '# The CloudFront layer also sets X-Robots-Tag: noindex, nofollow.' \
            'User-agent: *' \
            'Disallow: /' > "$RUNNER_TEMP/staging-robots.txt"
          aws s3 cp "$RUNNER_TEMP/staging-robots.txt" "s3://${BUCKET}/robots.txt" \
            --only-show-errors \
            --content-type "text/plain; charset=utf-8"

      - name: Invalidate staging CloudFront
        env:
          STACK_HINT: the apexyard-site-staging stack
        run: .github/scripts/invalidate-cloudfront.sh

      - name: Prove production has no overlay value
        env:
          OVERLAY_JSON: ${{ secrets.STAGING_OVERLAY }}
          PROD_BASE: https://apexyard.ai
        run: .github/scripts/check-prod-overlay-free.sh "$RUNNER_TEMP/site"
