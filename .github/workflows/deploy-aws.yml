name: Deploy to AWS (staging then production)

# Every main push first deploys to the staging distribution. Production then
# waits for approval on the GitHub `production` environment (required
# reviewers). Configure the protection rule in repository Settings, Environments.
#
# The shared AWS deploy role trusts the `main` branch subject only. A job that
# declares `environment:` presents an environment subject instead, so it cannot
# assume the role. The approval therefore lives in its own job, `approve-production`,
# which has no AWS access. `deploy-production` has no `environment:` and runs only
# after the approval job passes. Do not add `environment:` to a job that assumes
# the role. No long-lived AWS keys are stored in this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  BUCKET_PROD: apexyard-site-prod
  BUCKET_STAGING: apexyard-site-staging
  SITE_DOMAIN_PROD: apexyard.ai
  SITE_DOMAIN_STAGING: staging.apexyard.ai
  ROLE_ARN: arn:aws:iam::340541183783:role/github-actions-deployer

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    env:
      SITE_DOMAIN: staging.apexyard.ai
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync static site to staging S3
        run: |
          aws s3 sync . "s3://${BUCKET_STAGING}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "og/node_modules/*" \
            --exclude "og/templates/*" \
            --exclude "og/render*" \
            --exclude "og/package*.json" \
            --exclude "og/.gitignore" \
            --exclude "og/README.md" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --exclude ".lycheeignore"

      - name: Publish markdown alternates to staging
        run: |
          shopt -s nullglob
          for f in *.md.gen; do
            key="${f%.gen}"
            echo "publish $f -> s3://${BUCKET_STAGING}/${key}"
            aws s3 cp "$f" "s3://${BUCKET_STAGING}/${key}" \
              --content-type "text/markdown; charset=utf-8"
          done

      - name: Publish staging robots.txt
        run: |
          printf '%s\n' \
            '# Staging environment — not for indexing or crawling.' \
            '# The CloudFront layer also sets X-Robots-Tag: noindex, nofollow.' \
            'User-agent: *' \
            'Disallow: /' > /tmp/staging-robots.txt
          aws s3 cp /tmp/staging-robots.txt "s3://${BUCKET_STAGING}/robots.txt" \
            --content-type "text/plain; charset=utf-8"

      - name: Invalidate staging CloudFront
        env:
          STACK_HINT: the apexyard-site-staging stack
        run: .github/scripts/invalidate-cloudfront.sh

  approve-production:
    name: approve production
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Approval gate only. This job must not assume the AWS role.
    permissions: {}
    environment:
      name: production
      url: https://apexyard.ai/
    steps:
      - name: Production approved
        run: echo "Production deploy approved by the environment reviewers."

  deploy-production:
    name: deploy production
    needs: approve-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_DOMAIN: apexyard.ai
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync static site to production S3
        run: |
          aws s3 sync . "s3://${BUCKET_PROD}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "og/node_modules/*" \
            --exclude "og/templates/*" \
            --exclude "og/render*" \
            --exclude "og/package*.json" \
            --exclude "og/.gitignore" \
            --exclude "og/README.md" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --exclude ".lycheeignore"

      - name: Publish markdown alternates to production
        run: |
          shopt -s nullglob
          for f in *.md.gen; do
            key="${f%.gen}"
            echo "publish $f -> s3://${BUCKET_PROD}/${key}"
            aws s3 cp "$f" "s3://${BUCKET_PROD}/${key}" \
              --content-type "text/markdown; charset=utf-8"
          done

      - name: Invalidate production CloudFront
        env:
          STACK_HINT: the apexyard-site stack
        run: .github/scripts/invalidate-cloudfront.sh
