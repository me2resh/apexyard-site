<rect x="48" y="158" width="1104" height="520" rx="20" fill="#14213D" stroke="#47536A" /><path d="M 48 220 H 1152" stroke="#47536A"/><circle cx="80" cy="190" r="7" fill="#6B7586"/><circle cx="106" cy="190" r="7" fill="#8CA8FF"/><circle cx="132" cy="190" r="7" fill="#DCE1E9"/><text x="80" y="266" font-size="23" fill="#EEF1F4" font-weight="400" font-family="IBM Plex Mono, monospace"># Fork me2resh/apexyard on GitHub first</text><text x="80" y="318" font-size="23" fill="#8CA8FF" font-weight="400" font-family="IBM Plex Mono, monospace">$ brew install jq</text><text x="80" y="370" font-size="23" fill="#8CA8FF" font-weight="400" font-family="IBM Plex Mono, monospace">$ git clone https://github.com/your-org/apexyard.git</text><text x="80" y="422" font-size="23" fill="#8CA8FF" font-weight="400" font-family="IBM Plex Mono, monospace">$ cd apexyard</text><text x="80" y="474" font-size="23" fill="#8CA8FF" font-weight="400" font-family="IBM Plex Mono, monospace">$ bash bin/apexyard doctor</text><text x="80" y="538" font-size="23" fill="#EEF1F4" font-weight="400" font-family="IBM Plex Mono, monospace"># Then open Claude Code in the folder</text><text x="80" y="590" font-size="23" fill="#8CA8FF" font-weight="400" font-family="IBM Plex Mono, monospace">$ /setup</text><rect x="80" y="610" width="13" height="25" rx="1" fill="#8CA8FF" stroke="#8CA8FF" />
