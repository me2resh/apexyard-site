ight="400">Merged at</text><text x="580" y="624" font-size="21" fill="#14181F" font-weight="600">24 Oct 2026 · 14:32 UTC</text><text x="72" y="713" font-size="18" fill="#6B7586" font-weight="400">A saved record of checks, review and approval.</text><rect x="964" y="682" width="164" height="48" rx="10" fill="#2D5BE3" /><text text-anchor="middle" x="1046.0" y="712" font-size="18" fill="#FFFFFF" font-weight="600">Export</text><rect x="994" y="22" width="180" height="44" rx="22" fill="#EEF2FA" stroke="#6B7586" stroke-dasharray="6 5"/><text text-anchor="middle" x="1084" y="52" font-size="22" fill="#14181F" font-weight="500">Example</text></g></svg>
