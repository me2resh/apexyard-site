<text x="48" y="164" font-size="32" fill="#14213D" font-weight="650" >From idea to working code</text><text x="48" y="204" font-size="21" fill="#6B7586" font-weight="400" >A shared process for every change</text><path d="M 256 420 H 268 m -6 -5 6 5 -6 5" fill="none" stroke="#8CA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="300" width="208" height="270" rx="16" fill="#FFFFFF" stroke="#DCE1E9" /><rect x="68" y="322" width="36" height="36" rx="10" fill="#EEF1F4" stroke="#EEF1F4" /><text x="86" y="347" font-size="17" fill="#2D5BE3" font-weight="600" text-anchor="middle">1</text><text x="68" y="397" font-size="24" fill="#14213D" font-weight="650" >Idea</text><text x="68" y="433" font-size="15" fill="#6B7586" font-weight="400" >Describe the goal</text><text x="68" y="460" font-size="15" fill="#6B7586" font-weight="400" >Capture the context</text><path d="M 480 420 H 492 m -6 -5 6 5 -6 5" fill="none" stroke="#8CA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="272" y="300" width="208" height="270" rx="16" fill="#FFFFFF" stroke="#DCE1E9" /><rect x="292" y="322" width="36" height="36" rx="10" fill="#EEF1F4" stroke="#EEF1F4" /><text x="310" y="347" font-size="17" fill="#2D5BE3" font-weight="600" text-anchor="middle">2</text><text x="292" y="397" font-size="24" fill="#14213D" font-weight="650" >Spec</text><text x="292" y="433" font-size="15" fill="#6B7586" font-weight="400" >Define the outcome</text><text x="292" y="460" font-size="15" fill="#6B7586" font-weight="400" >Set clear boundaries</text><path d="M 704 420 H 716 m -6 -5 6 5 -6 5" fill="none" stroke="#8CA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="496" y="300" width="208" height="270" rx="16" fill="#FFFFFF" stroke="#DCE1E9" /><rect x="516" y="322" width="36" height="36" rx="10" fill="#EEF1F4" stroke="#EEF1F4" /><text x="534" y="347" font-size="17" fill="#2D5BE3" font-weight="600" text-anchor="middle">3</text><text x="516" y="397" font-size="24" fill="#14213D" font-weight="650" >Plan</text><text x="516" y="433" font-size="15" fill="#6B7586" font-weight="400" >Choose the approach</text><text x="516" y="460" font-size="15" fill="#6B7586" font-weight="400" >Review the steps</text><path d="M 928 420 H 940 m -6 -5 6 5 -6 5" fill="none" stroke="#8CA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="720" y="300" width="208" height="270" rx="16" fill="#FFFFFF" stroke="#DCE1E9" /><rect x="740" y="322" width="36" height="36" rx="10" fill="#EEF1F4" stroke="#EEF1F4" /><text x="758" y="347" font-size="17" fill="#2D5BE3" font-weight="600" text-anchor="middle">4</text><text x="740" y="397" font-size="24" fill="#14213D" font-weight="650" >Tickets</text><text x="740" y="433" font-size="15" fill="#6B7586" font-weight="400" >Small, focused tasks</text><text x="740" y="460" font-size="15" fill="#6B7586" font-weight="400" >Ready for your agents</text><circle cx="745" cy="495" r="4" fill="#1F8A5B"/><text x="758" y="500" font-size="14" fill="#47536A" font-weight="400" >#41 Add export</text><circle cx="745" cy="531" r="4" fill="#2D5BE3"/><text x="758" y="536" font-size="14" fill="#47536A" font-weight="400" >#42 Rate limits</text><rect x="944" y="300" width="208" height="270" rx="16" fill="#FFFFFF" stroke="#DCE1E9" /><rect x="964" y="322" width="36" height="36" rx="10" fill="#EEF1F4" stroke="#EEF1F4" /><text x="982" y="347" font-size="17" fill="#2D5BE3" font-weight="600" text-anchor="middle">5</text><text x="964" y="397" font-size="24" fill="#14213D" font-weight="650" >Code</text><text x="964" y="433" font-size="15" fill="#6B7586" font-weight="400" >Implement the change</text><text x="964" y="460" font-size="15" fill="#6B7586" font-weight="400" >Verify the result</text><text x="48" y="680" font-size="20" fill="#47536A" font-weight="400" >One workflow. Clear handoffs at every step.</text>
