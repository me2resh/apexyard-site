<rect x="48" y="136" width="1104" height="612" rx="16" fill="#FFFFFF" stroke="#DCE1E9" /><text x="80" y="188" font-size="30" fill="#14213D" font-weight="650" >Review change</text><text x="80" y="226" font-size="22" fill="#47536A" font-weight="400" >#41 Add export</text><text x="1120" y="224" font-size="18" fill="#6B7586" font-weight="400" text-anchor="end">your-org/web</text><rect x="80" y="264" width="1040" height="96" rx="12" fill="#F2F4F8" stroke="#EEF1F4" /><text x="104" y="298" font-size="21" fill="#14213D" font-weight="600" >Code reviewer</text><text x="104" y="331" font-size="18" fill="#6B7586" font-weight="400" >Implementation is clear and consistent.</text><rect x="962" y="294" width="134" height="36" rx="18" fill="#FFFFFF" stroke="#1F8A5B" /><text x="1029.0" y="319" font-size="16" fill="#1F8A5B" font-weight="600" text-anchor="middle">Approved</text><rect x="80" y="376" width="1040" height="96" rx="12" fill="#F2F4F8" stroke="#EEF1F4" /><text x="104" y="410" font-size="21" fill="#14213D" font-weight="600" >Security reviewer</text><text x="104" y="443" font-size="18" fill="#6B7586" font-weight="400" >Add a permission check before export.</text><rect x="892" y="406" width="204" height="36" rx="18" fill="#FFFFFF" stroke="#B7791F" /><text x="994.0" y="431" font-size="16" fill="#B7791F" font-weight="600" text-anchor="middle">Changes requested</text><rect x="80" y="488" width="1040" height="96" rx="12" fill="#F2F4F8" stroke="#EEF1F4" /><text x="104" y="522" font-size="21" fill="#14213D" font-weight="600" >Architect</text><text x="104" y="555" font-size="18" fill="#6B7586" font-weight="400" >The change fits the existing boundaries.</text><rect x="962" y="518" width="134" height="36" rx="18" fill="#FFFFFF" stroke="#1F8A5B" /><text x="1029.0" y="543" font-size="16" fill="#1F8A5B" font-weight="600" text-anchor="middle">Approved</text><rect x="80" y="600" width="1040" height="96" rx="12" fill="#F2F4F8" stroke="#EEF1F4" /><text x="104" y="634" font-size="21" fill="#1421