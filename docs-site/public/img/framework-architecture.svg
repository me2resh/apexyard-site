<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="40 120 1880 925" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" role="img" aria-label="ApexYard architecture: five layers (governance, capability, framework defaults, customisation, per-project data) inside the ops fork, plus an optional private sibling repo on the right.">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14181F"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3D4554"/>
    </marker>
    <marker id="arrow-override" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6DF6"/>
    </marker>
    <style>
      /* Dark-mode adaptation: swap paper background and ink text only.
         Per-layer accent colors keep their identity in both themes.
         Two ways in, like the page tokens: the OS setting (the media block,
         skipped when the toggle pinned light) and the toggle pinning dark
         (data-theme on the root element). Same swaps apply to both themes.
         Keep them in sync. No angle brackets anywhere in this block: inside inline SVG the
         style text is parsed as markup, not raw text, and a stray tag here
         silently empties the whole sheet. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) rect[fill="#F7F9FC"] { fill: #121A30; }
        :root:not([data-theme="light"]) rect[fill="#FFFFFF"] { fill: #1B2540; }
        :root:not([data-theme="light"]) text[fill="#14181F"] { fill: #F7F9FC; }
        :root:not([data-theme="light"]) text[fill="#3D4554"] { fill: #C3CCDB; }
        :root:not([data-theme="light"]) text[fill="#5B6472"] { fill: #8B95A7; }
        :root:not([data-theme="light"]) #arrow-solid path { fill: #F7F9FC; }
        :root:not([data-theme="light"]) #arrow-dashed path { fill: #C3CCDB; }
        /* Lift layer background fills slightly so they read against the dark page bg */
        :root:not([data-theme="light"]) rect[fill="#E0E8F0"] { fill: #2A3A50; }
        :root:not([data-theme="light"]) rect[fill="#DDE9DD"] { fill: #2A4A3A; }
        :root:not([data-theme="light"]) rect[fill="#EFE6CA"] { fill: #4A4030; }
        :root:not([data-theme="light"]) rect[fill="#FBE7E1"] { fill: #5A2A20; }
        :root:not([data-theme="light"]) rect[fill="#E8E0EA"] { fill: #3A2D45; }
        /* Section labels: keep the accent hue, but lift the saturation for dark contrast. */
        :root:not([data-theme="light"]) text[fill="#1E3A5F"] { fill: #7AA0CC; }
        :root:not([data-theme="light"]) text[fill="#2D6A4F"] { fill: #7DC79A; }
        :root:not([data-theme="light"]) text[fill="#8B6914"] { fill: #D4B560; }
        :root:not([data-theme="light"]) text[fill="#5B3E70"] { fill: #B795D0; }
      }
      :root[data-theme="dark"] rect[fill="#F7F9FC"] { fill: #121A30; }
      :root[data-theme="dark"] rect[fill="#FFFFFF"] { fill: #1B2540; }
      :root[data-theme="dark"] text[fill="#14181F"] { fill: #F7F9FC; }
      :root[data-theme="dark"] text[fill="#3D4554"] { fill: #C3CCDB; }
      :root[data-theme="dark"] text[fill="#5B6472"] { fill: #8B95A7; }
      :root[data-theme="dark"] #arrow-solid path { fill: #F7F9FC; }
      :root[data-theme="dark"] #arrow-dashed path { fill: #C3CCDB; }
      /* Lift layer background fills slightly so they read against the dark page bg */
      :root[data-theme="dark"] rect[fill="#E0E8F0"] { fill: #2A3A50; }
      :root[data-theme="dark"] rect[fill="#DDE9DD"] { fill: #2A4A3A; }
      :root[data-theme="dark"] rect[fill="#EFE6CA"] { fill: #4A4030; }
      :root[data-theme="dark"] rect[fill="#FBE7E1"] { fill: #5A2A20; }
      :root[data-theme="dark"] rect[fill="#E8E0EA"] { fill: #3A2D45; }
      /* Section labels: keep the accent hue, but lift the saturation for dark contrast. */
      :root[data-theme="dark"] text[fill="#1E3A5F"] { fill: #7AA0CC; }
      :root[data-theme="dark"] text[fill="#2D6A4F"] { fill: #7DC79A; }
      :root[data-theme="dark"] text[fill="#8B6914"] { fill: #D4B560; }
      :root[data-theme="dark"] text[fill="#5B3E70"] { fill: #B795D0; }
    </style>
  </defs>
  <!-- ============================================================ -->
  <!-- MAIN FORK BOX (LEFT)                                         -->
  <!-- ============================================================ -->
  <rect x="60" y="135" width="1280" height="900" fill="#F7F9FC" stroke="#14181F" stroke-width="1.5"/>
  <text x="84" y="170" font-size="18" font-weight="700" fill="#14181F">[#] ApexYard Ops Fork</text>
  <text x="290" y="170" font-size="13" fill="#3D4554" font-style="italic">(your-org/apexyard: the public fork you clone)</text>
  <!-- ─────────── LAYER 1: GOVERNANCE, slate-blue ─────────── -->
  <text x="84" y="210" font-size="12" font-weight="700" fill="#1E3A5F" letter-spacing="2">GOVERNANCE: declares what, enforces how</text>
  <rect x="84" y="225" width="290" height="90" fill="#E0E8F0" stroke="#2C4E70" stroke-width="1.3"/>
  <text x="100" y="252" font-size="14" font-weight="700" fill="#1E3A5F">[*] Registry</text>
  <text x="100" y="275" font-size="12" fill="#14181F">apexyard.projects.yaml</text>
  <text x="100" y="295" font-size="11" fill="#4A6FA5">Lists every managed project</text>
  <rect x="394" y="225" width="290" height="90" fill="#E0E8F0" stroke="#2C4E70" stroke-width="1.3"/>
  <text x="410" y="252" font-size="14" font-weight="700" fill="#1E3A5F">[~] Hooks</text>
  <text x="410" y="275" font-size="12" fill="#14181F">.claude/hooks/  · 66 shell gates</text>
  <text x="410" y="295" font-size="11" fill="#4A6FA5">Merge gate · ticket-first · secrets · …</text>
  <rect x="704" y="225" width="290" height="90" fill="#E0E8F0" stroke="#2C4E70" stroke-width="1.3"/>
  <text x="720" y="252" font-size="14" font-weight="700" fill="#1E3A5F">[=] Rules</text>
  <text x="720" y="275" font-size="12" fill="#14181F">.claude/rules/  · 22 rule files</text>
  <text x="720" y="295" font-size="11" fill="#4A6FA5">Self-discipline guides for the agent</text>
  <rect x="1014" y="225" width="290" height="90" fill="#E0E8F0" stroke="#2C4E70" stroke-width="1.3"/>
  <text x="1030" y="252" font-size="14" font-weight="700" fill="#1E3A5F">[i] Onboarding</text>
  <text x="1030" y="275" font-size="12" fill="#14181F">onboarding.yaml</text>
  <text x="1030" y="295" font-size="11" fill="#4A6FA5">Company name, mission, team, stack</text>
  <!-- ─────────── LAYER 2: CAPABILITY, forest-green ─────────── -->
  <text x="84" y="358" font-size="12" font-weight="700" fill="#1B4332" letter-spacing="2">CAPABILITY: what the agent can do</text>
  <rect x="84" y="373" width="600" height="100" fill="#DDE9DD" stroke="#2D6A4F" stroke-width="1.3"/>
  <text x="100" y="402" font-size="15" font-weight="700" fill="#1B4332">[/] Skills</text>
  <text x="100" y="425" font-size="12" fill="#14181F">.claude/skills/  ·  69 slash commands</text>
  <text x="100" y="447" font-size="11" fill="#52796F">/feature  /handover  /c4  /threat-model  /process  /dfd  /journey  /update  /release  …</text>
  <rect x="704" y="373" width="600" height="100" fill="#DDE9DD" stroke="#2D6A4F" stroke-width="1.3"/>
  <text x="720" y="402" font-size="15" font-weight="700" fill="#1B4332">[&gt;] Agents</text>
  <text x="720" y="425" font-size="12" fill="#14181F">.claude/agents/  ·  23 specialised sub-agents</text>
  <text x="720" y="447" font-size="11" fill="#52796F">Rex (code review) · Hakim (security) · Munir (deps) · Tariq (PR) · Idris (tickets)</text>
  <!-- ─────────── LAYER 3: FRAMEWORK DEFAULTS, ochre ─────────── -->
  <text x="84" y="513" font-size="12" font-weight="700" fill="#5C4218" letter-spacing="2">FRAMEWORK DEFAULTS: ship by default</text>
  <rect x="84" y="528" width="600" height="85" fill="#EFE6CA" stroke="#8B6914" stroke-width="1.3"/>
  <text x="100" y="555" font-size="14" font-weight="700" fill="#5C4218">[T] templates/</text>
  <text x="100" y="578" font-size="12" fill="#14181F">PRD · AgDR · technical-design · C4 context/container · DFD · vision · spike · …</text>
  <text x="100" y="600" font-size="11" fill="#946C2B" font-style="italic">Overridable per file via custom-templates/&lt;same-path&gt;.md</text>
  <rect x="704" y="528" width="600" height="85" fill="#EFE6CA" stroke="#8B6914" stroke-width="1.3"/>
  <text x="720" y="555" font-size="14" font-weight="700" fill="#5C4218">[H] handbooks/</text>
  <text x="720" y="578" font-size="12" fill="#14181F">architecture/  ·  general/  ·  language/&lt;lang&gt;/  ← Rex consults during code review</text>
  <text x="720" y="600" font-size="11" fill="#946C2B" font-style="italic">Additive: custom-handbooks/&lt;path&gt; layered alongside, NOT replacing</text>
  <!-- ─────────── LAYER 4: CUSTOMISATION, accent red ─────────── -->
  <text x="84" y="653" font-size="12" font-weight="700" fill="#2F6DF6" letter-spacing="2">CUSTOMISATION LAYER: adopter overrides</text>
  <rect x="84" y="668" width="395" height="90" fill="#FBE7E1" stroke="#2F6DF6" stroke-width="1.5"/>
  <text x="100" y="695" font-size="13" font-weight="700" fill="#2F6DF6">[+] custom-templates/</text>
  <text x="100" y="717" font-size="11" fill="#14181F">Path-mirror override</text>
  <text x="100" y="737" font-size="11" fill="#A03B1F" font-style="italic">Wins over framework on collision (#244)</text>
  <rect x="494" y="668" width="395" height="90" fill="#FBE7E1" stroke="#2F6DF6" stroke-width="1.5"/>
  <text x="510" y="695" font-size="13" font-weight="700" fill="#2F6DF6">[+] custom-skills/</text>
  <text x="510" y="717" font-size="11" fill="#14181F">Symlinked into .claude/skills/</text>
  <text x="510" y="737" font-size="11" fill="#A03B1F" font-style="italic">Framework moves to .framework.bak (#243)</text>
  <rect x="904" y="668" width="400" height="90" fill="#FBE7E1" stroke="#2F6DF6" stroke-width="1.5"/>
  <text x="920" y="695" font-size="13" font-weight="700" fill="#2F6DF6">[+] custom-handbooks/</text>
  <text x="920" y="717" font-size="11" fill="#14181F">Additive: Rex reads BOTH layers</text>
  <text x="920" y="737" font-size="11" fill="#A03B1F" font-style="italic">Same path conventions as framework (#243)</text>
  <!-- Override arrows: customisation → defaults -->
  <line x1="281" y1="668" x2="281" y2="615" stroke="#2F6DF6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-override)"/>
  <line x1="691" y1="668" x2="180" y2="473" stroke="#2F6DF6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-override)" opacity="0.55"/>
  <line x1="1104" y1="668" x2="1004" y2="615" stroke="#2F6DF6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-override)"/>
  <text x="296" y="640" font-size="10" fill="#2F6DF6" font-style="italic">overrides</text>
  <text x="1014" y="640" font-size="10" fill="#2F6DF6" font-style="italic">layers onto</text>
  <!-- ─────────── LAYER 5: PER-PROJECT DATA, plum ─────────── -->
  <text x="84" y="798" font-size="12" font-weight="700" fill="#3D2A50" letter-spacing="2">PER-PROJECT DATA: one entry per row in the registry</text>
  <rect x="84" y="813" width="600" height="195" fill="#E8E0EA" stroke="#5B3E70" stroke-width="1.3"/>
  <text x="100" y="842" font-size="14" font-weight="700" fill="#3D2A50">[d] projects/&lt;name&gt;/</text>
  <text x="100" y="864" font-size="11" fill="#6F538C" font-style="italic">Committed to the fork: ApexYard's view of each project</text>
  <line x1="100" y1="877" x2="668" y2="877" stroke="#5B3E70" stroke-width="0.5" opacity="0.4"/>
  <text x="100" y="900" font-size="12" fill="#14181F">README.md  ·  roadmap.md  ·  handover-assessment.md</text>
  <text x="100" y="920" font-size="12" fill="#14181F">prds/  ·  architecture/  (C4, DFD, vision)  ·  journeys/</text>
  <text x="100" y="940" font-size="12" fill="#14181F">processes/ (BPMN)  ·  feature-inventory.md  ·  audits/  ·  updates/</text>
  <text x="100" y="960" font-size="12" fill="#14181F">docs/agdr/  ← per-project Agent Decision Records</text>
  <text x="100" y="988" font-size="10" fill="#6F538C" font-style="italic">"Would it follow the code if the project spun out tomorrow?"  NO → here.</text>
  <rect x="704" y="813" width="600" height="195" fill="#E8E0EA" stroke="#5B3E70" stroke-width="1.3"/>
  <text x="720" y="842" font-size="14" font-weight="700" fill="#3D2A50">[w] workspace/&lt;name&gt;/</text>
  <text x="720" y="864" font-size="11" fill="#6F538C" font-style="italic">Live git clones, gitignored from the fork itself</text>
  <line x1="720" y1="877" x2="1288" y2="877" stroke="#5B3E70" stroke-width="0.5" opacity="0.4"/>
  <text x="720" y="900" font-size="12" fill="#14181F">Real git clone of the managed repo</text>
  <text x="720" y="920" font-size="12" fill="#14181F">cd into to do code work · branches · PRs · CI</text>
  <text x="720" y="940" font-size="12" fill="#14181F">LSP-aware skills run here (semantic index)</text>
  <text x="720" y="960" font-size="12" fill="#14181F">Cross-repo trace (/process, /dfd) follows registry links</text>
  <text x="720" y="988" font-size="10" fill="#6F538C" font-style="italic">"Would it follow the code if the project spun out tomorrow?"  YES → here.</text>
  <!-- ============================================================ -->
  <!-- PRIVATE SIBLING REPO (RIGHT): slate, dashed                 -->
  <!-- ============================================================ -->
  <rect x="1380" y="135" width="480" height="900" fill="#F7F9FC" stroke="#3D4554" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="1404" y="170" font-size="18" font-weight="700" fill="#14181F">[lock] Sibling Private Repo</text>
  <text x="1404" y="192" font-size="12" fill="#3D4554" font-style="italic">Optional: split-portfolio v2 mode</text>
  <text x="1404" y="225" font-size="12" fill="#14181F">For adopters on GitHub Free who do not want</text>
  <text x="1404" y="242" font-size="12" fill="#14181F">portfolio names on a public repo. Resolved via</text>
  <text x="1404" y="259" font-size="12" fill="#14181F"><tspan font-weight="700">portfolio.*</tspan> keys in <tspan font-weight="700">.claude/project-config.json</tspan></text>
  <line x1="1404" y1="280" x2="1836" y2="280" stroke="#3D4554" stroke-width="1"/>
  <text x="1404" y="305" font-size="11" font-weight="700" fill="#14181F" letter-spacing="1">CONTENTS: replaces public-fork copies</text>
  <g font-size="12" fill="#14181F">
    <!-- the four files use their layer's colour as a left-border hint -->
    <rect x="1404" y="320" width="432" height="32" fill="#E0E8F0" stroke="#2C4E70" stroke-width="0.9"/>
    <text x="1418" y="341">[*] apexyard.projects.yaml</text>
    <rect x="1404" y="362" width="432" height="32" fill="#E0E8F0" stroke="#2C4E70" stroke-width="0.9"/>
    <text x="1418" y="383">[i] onboarding.yaml</text>
    <rect x="1404" y="404" width="432" height="32" fill="#E8E0EA" stroke="#5B3E70" stroke-width="0.9"/>
    <text x="1418" y="425">[d] projects/</text>
    <rect x="1404" y="446" width="432" height="32" fill="#E8E0EA" stroke="#5B3E70" stroke-width="0.9"/>
    <text x="1418" y="467">[w] workspace/</text>
    <rect x="1404" y="488" width="432" height="32" fill="#FBE7E1" stroke="#2F6DF6" stroke-width="1.3"/>
    <text x="1418" y="509" fill="#2F6DF6">[+] custom-templates/</text>
    <rect x="1404" y="530" width="432" height="32" fill="#FBE7E1" stroke="#2F6DF6" stroke-width="1.3"/>
    <text x="1418" y="551" fill="#2F6DF6">[+] custom-skills/</text>
    <rect x="1404" y="572" width="432" height="32" fill="#FBE7E1" stroke="#2F6DF6" stroke-width="1.3"/>
    <text x="1418" y="593" fill="#2F6DF6">[+] custom-handbooks/</text>
  </g>
  <text x="1404" y="635" font-size="11" fill="#3D4554" font-style="italic">When v2 is enabled, skills resolve these paths</text>
  <text x="1404" y="652" font-size="11" fill="#3D4554" font-style="italic">transparently. The public fork stays slim,</text>
  <text x="1404" y="669" font-size="11" fill="#3D4554" font-style="italic">your private data never leaks upstream.</text>
  <line x1="1404" y1="690" x2="1836" y2="690" stroke="#3D4554" stroke-width="1"/>
  <text x="1404" y="715" font-size="11" font-weight="700" fill="#14181F" letter-spacing="1">PUBLIC FORK MARKER</text>
  <rect x="1404" y="725" width="432" height="40" fill="#EEF2F8" stroke="#14181F" stroke-width="0.9"/>
  <text x="1418" y="745" font-size="12" fill="#14181F">[anchor] .apexyard-fork  <tspan fill="#5B6472">(presence marker)</tspan></text>
  <text x="1418" y="760" font-size="10" fill="#5B6472">walked-up by hooks to find the ops-fork root</text>
  <line x1="1380" y1="475" x2="1304" y2="475" stroke="#3D4554" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="1310" y="465" font-size="10" fill="#3D4554" font-style="italic" text-anchor="end">resolves into fork</text>
</svg>
